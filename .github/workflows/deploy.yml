name: Deploy to Cloudflare Workers

# Ordinary commits to main do NOT deploy.
# Release either by clicking "Run workflow" on the Actions tab,
# or by pushing a version tag:  git tag v1.0 && git push origin v1.0
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Never let two deployments race each other.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build a clean upload directory: the site only, no repo/internal files.
      # CLAUDE.md and README.md are excluded on purpose — they would otherwise be
      # publicly fetchable at /CLAUDE.md and they contain internal notes and TODOs.
      - name: Stage site files
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.image-slots.state.json' \
            --exclude='CLAUDE.md' \
            --exclude='README.md' \
            --exclude='scripts' \
            --exclude='wrangler.toml' \
            ./ _site/

      - name: Generate static pages and sitemap
        run: node scripts/build-static-pages.mjs _site

      - name: Sanity check the bundle
        run: |
          set -e
          test -f _site/index.html || { echo "::error::index.html missing"; exit 1; }
          test -f _site/products/lgy-610/index.html || { echo "::error::LGY_610 product page missing"; exit 1; }
          test -f _site/products/lgy-840/index.html || { echo "::error::LGY_840 product page missing"; exit 1; }
          test -f _site/products/lga-j900-t/index.html || { echo "::error::LGA_J900_T product page missing"; exit 1; }
          test -f _site/support.js || { echo "::error::support.js missing — the site would not render"; exit 1; }

          # Indexable section routes — a generator regression here would ship 404s to
          # every link and search result pointing at them.
          for sec in products about restaurants compare contact; do
            test -f "_site/$sec/index.html" || { echo "::error::section page missing: /$sec/"; exit 1; }
          done
          test -f _site/sitemap.xml || { echo "::error::sitemap.xml missing"; exit 1; }
          grep -q '<loc>.*/about/</loc>' _site/sitemap.xml || { echo "::error::sitemap.xml is missing the section routes"; exit 1; }

          echo "files: $(find _site -type f | wc -l)"
          echo "size:  $(du -sh _site | cut -f1)"

          # Cloudflare Pages rejects any single file over 25 MiB.
          big=$(find _site -type f -size +25M)
          if [ -n "$big" ]; then
            echo "::error::file(s) exceed the 25 MiB Cloudflare Pages limit:"
            echo "$big"
            exit 1
          fi

          # Every local asset referenced by index.html must exist with exactly the
          # right case. Windows and macOS are case-insensitive but Cloudflare is not,
          # so a case slip shows up only in production as silently broken images.
          missing=0
          for ref in $(grep -oE 'assets/[A-Za-z0-9_./-]+\.(webp|jpg|jpeg|png|svg|mp4)' _site/index.html | sort -u); do
            if [ ! -f "_site/$ref" ]; then
              echo "::error::referenced asset missing or wrong case: $ref"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      # wrangler is called directly rather than through cloudflare/wrangler-action,
      # which swallows wrangler's stderr and reports only "exit code 1".
      - name: Check credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          fail=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::secret CLOUDFLARE_API_TOKEN is missing or empty"; fail=1
          else
            echo "CLOUDFLARE_API_TOKEN present (${#CLOUDFLARE_API_TOKEN} chars)"
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::secret CLOUDFLARE_ACCOUNT_ID is missing or empty"; fail=1
          else
            echo "CLOUDFLARE_ACCOUNT_ID present (${#CLOUDFLARE_ACCOUNT_ID} chars)"
          fi
          exit $fail

      # Validates wrangler.toml and the asset directory without publishing.
      # Diagnostic only — never blocks the deploy.
      - name: Validate config (dry run)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
